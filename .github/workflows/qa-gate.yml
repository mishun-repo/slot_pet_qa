name: QA Automation Quality Gate

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Gate 1: Shift-Left Security (проверка на утечку секретов в PR)
  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QA repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Gate 2: Автотесты против целевого приложения
  qa-tests:
    name: qa-tests
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout QA repo
        uses: actions/checkout@v4
        with:
          path: slot-pet-qa

      - name: Checkout Target App (SUT)
        uses: actions/checkout@v4
        with:
          repository: mishun-repo/slot_pet_project
          path: slot_pet_project

      - name: Install & Start SUT (slot_pet_project)
        working-directory: slot_pet_project
        run: |
          if [ -f "package-lock.json" ]; then npm ci; else npm install; fi
          for dir in client frontend server backend; do
            if [ -f "$dir/package.json" ]; then
              (cd "$dir" && if [ -f "package-lock.json" ]; then npm ci; else npm install; fi)
            fi
          done

          nohup npm run dev > ../sut.log 2>&1 &

          echo "Waiting for SUT on http://localhost:5173..."
          for i in $(seq 1 30); do
            if curl -sSf http://localhost:5173 > /dev/null 2>&1; then
              echo "SUT is up!"
              exit 0
            fi
            sleep 2
          done

          echo "SUT failed to start within 60s. Logs:"
          cat ../sut.log
          exit 1

      - name: Run QA Tests
        working-directory: slot-pet-qa
        run: |
          if [ -f "package-lock.json" ]; then npm ci; else npm install; fi
          npx playwright install --with-deps chromium
          npm run lint --if-present
          npx playwright test

      - name: Upload Test & SUT Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts
          path: |
            slot-pet-qa/playwright-report/
            slot-pet-qa/test-results/
            sut.log
          if-no-files-found: ignore

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-test-report
          path: |
            slot-pet-qa/playwright-report/
            slot-pet-qa/test-results/
          if-no-files-found: ignore